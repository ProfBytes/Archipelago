name: Build apworld

on:
  release:
    types: [published]

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip files
        run: zip -r pokemon_tcg.apworld worlds/pokemon_tcg/ 

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: pokemon_tcg.apworld
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
